[build-system]
requires = [
    'hatchling',
]
build-backend = 'hatchling.build'


[project]
name = 'sqlalchemy_pyodbc_mssql'
description = 'SQLAlchemy dialect for MSSQL using PyODBC which handles MSSQL-specific limitations'
authors = [
    {name = 'Matt Lewellyn', email = 'matt.lewellyn@level12.io'},
]
requires-python = '>=3.12'
dynamic = ['version']
readme = 'readme.md'
license = 'BSD-3-Clause'
license-files = ['license.txt']
classifiers = [
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: BSD License',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15',
]
dependencies = [
    'pyodbc',
    'SQLAlchemy>=2.0',
]


[project.urls]
Homepage = 'https://github.com/level12/sqlalchemy_pyodbc_mssql'
Repository = 'https://github.com/level12/sqlalchemy_pyodbc_mssql'


[project.optional-dependencies]
tests = [
    'pytest',
    'pytest-cov',
]


[project.entry-points.'sqlalchemy.dialects']
'mssql.pyodbc_mssql' = 'sqlalchemy_pyodbc_mssql.dialect:MssqlDialectPyodbcQuoted'


[dependency-groups]
dev = [
    {include-group = "pytest"},
    {include-group = "prek"},
    {include-group = "audit"},
    {include-group = "build"},
    {include-group = "nox"},
    'click',
    'ruff==0.16.2',
]
# Used by nox
pytest = [
    'pytest',
    'pytest-cov',
]
# Used by nox
prek = [
    'prek',
]
# Used by nox
audit = [
    'pip-audit',
]
# Used by nox
build = [
    'build',
    'twine',
]
# Used by CI
nox = [
    'nox',
]
